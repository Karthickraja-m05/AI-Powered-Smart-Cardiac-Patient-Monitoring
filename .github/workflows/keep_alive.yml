name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    name: Ping Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping Request
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://cardiosense-backend.onrender.com' }}
        run: |
          echo "Pinging health endpoint: ${BACKEND_URL}/api/health"
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${BACKEND_URL}/api/health" --max-time 60)
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$HTTP_RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Response Body: $BODY"
          echo "Status Code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✅ Backend is awake and healthy!"
          else
            echo "⚠️ Unexpected status code: $STATUS_CODE (Backend might still be waking up)"
          fi
